name: Build & Publish

on:
  push:
    branches:
      - '26.2'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle Wrapper Integrity
        uses: gradle/actions/wrapper-validation@v4

      - name: Build & Publish to Maven
        env:
          MAVEN_URL: ${{ secrets.LT_MAVEN_SNAPSHOTS_URL }}
          MAVEN_USERNAME: ${{ secrets.LT_MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.LT_MAVEN_PASS }}
        run: ./gradlew build publish

      - name: Locate built Jarfile
        id: jar
        run: echo "jarfile=$(find build/libs/ -name "*.jar" -not -name "*slim*" -not -name "*source*")" >> $GITHUB_ENV

      - name: Set Artifact name
        id: jarname
        run: echo "jarname=$(find build/libs/ -name "*.jar" -not -name "*slim*" -not -name "*source*" | sed 's:.*/::')" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.jarname }}
          path: ${{ env.jarfile }}
